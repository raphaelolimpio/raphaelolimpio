name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          user: raphaelolimpio
          template: classic
          base: header, activity, community, repositories
          
          # Ajuste para evitar que a imagem fique muito longa/cortada
          config_padding: 0, 8%
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_facts: no # Desativado para reduzir altura
          plugin_habits_charts: yes
